<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block Blast AI - MOBILE V3.1</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #121619; color: #ecf0f1; margin: 10px; display: flex; flex-direction: column; align-items: center; user-select: none; }
        h1 { margin: 5px 0 0 0; font-size: 20px; letter-spacing: 1px; text-align: center; }
        .subtitle { font-size: 11px; color: #95a5a6; margin-bottom: 12px; text-align: center; padding: 0 10px; }
        
        /* メインコンテナ：PCでは横並び、スマホでは縦並び */
        .container { display: flex; flex-direction: column; gap: 15px; background: #1e2429; padding: 12px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); width: 100%; max-width: 960px; box-sizing: border-box; }
        
        @media (min-width: 768px) {
            .container { flex-direction: row; padding: 18px; gap: 20px; }
            .controls { width: 550px !important; }
        }

        /* 盤面エリア */
        .board-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; }
        
        /* グリッドサイズをレスポンシブ化 */
        .grid { display: grid; grid-template-columns: repeat(8, min(42px, 10.5vw)); grid-template-rows: repeat(8, min(42px, 10.5vw)); gap: 2px; background: #2c3e50; padding: 6px; border-radius: 8px; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .bc { width: 100%; height: 100%; background: #34495e; border-radius: 4px; cursor: crosshair; transition: background 0.1s; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: min(18px, 4.5vw); color: rgba(255,255,255,0.9); }
        
        .bc.filled { background: #e74c3c; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3); }
        .bc.hint-1 { background: #2ecc71; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3); animation: pop 0.2s ease-out; } 
        .bc.hint-2 { background: #f1c40f; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3); animation: pop 0.2s ease-out; } 
        .bc.hint-3 { background: #3498db; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3); animation: pop 0.2s ease-out; } 
        
        @keyframes pop { 0% { transform: scale(0.8); } 100% { transform: scale(1); } }

        /* コントロールエリア */
        .controls { width: 100%; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; }
        .bank-title { font-weight: bold; font-size: 13px; color: #bdc3c7; border-bottom: 2px solid #34495e; padding-bottom: 4px; margin-top: 4px; display: flex; justify-content: space-between; align-items: center; }
        
        /* 盤面状況データダッシュボード */
        .status-dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 5px; width: 100%; box-sizing: border-box; }
        @media (min-width: 480px) { .status-dashboard { grid-template-columns: repeat(3, 1fr); } }
        
        .status-card { background: #161a1d; border: 1px solid #2c3e50; padding: 6px; border-radius: 6px; text-align: center; }
        .status-card.large { grid-column: span 2; background: #1a2126; border-color: #34495e; display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; }
        @media (min-width: 480px) { .status-card.large { grid-column: span 3; } }
        
        .status-label { font-size: 10px; color: #95a5a6; margin-bottom: 1px; }
        .status-value { font-size: 13px; font-weight: bold; color: #f39c12; font-family: 'Courier New', monospace; }
        .eval-title { font-size: 12px; font-weight: bold; color: #ecf0f1; }
        .eval-score { font-size: 18px; font-weight: bold; font-family: 'Courier New', monospace; }

        /* 手持ちスロット */
        .slots { display: flex; gap: 6px; width: 100%; }
        .slot { flex: 1; height: 38px; background: #2c3e50; border: 2px dashed #7f8c8d; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; text-align: center; color: #95a5a6; cursor: pointer; }
        .slot.active { border-color: #3498db; background: #1f364d; color: #fff; font-weight: bold; box-shadow: 0 0 8px rgba(52, 152, 219, 0.4); }
        
        /* ブロック図鑑 */
        .pieces-bank { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; max-height: 200px; overflow-y: auto; padding-right: 2px; }
        @media (min-width: 400px) { .pieces-bank { grid-template-columns: repeat(4, 1fr); } }
        @media (min-width: 768px) { .pieces-bank { grid-template-columns: repeat(5, 1fr); max-height: 240px; } }
        
        .piece-card { background: #2c3e50; padding: 4px 2px; border-radius: 6px; cursor: pointer; text-align: center; border: 1px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: space-between; transition: all 0.1s ease; min-height: 64px; }
        .piece-card:hover { border-color: #3498db; background: #34495e; }
        
        .mini-matrix { display: inline-block; margin-top: 1px; background: #1a252f; padding: 2px; border-radius: 4px; }
        .mini-row { display: flex; justify-content: center; gap: 1px; margin-bottom: 1px; }
        .mini-row:last-child { margin-bottom: 0; }
        .mini-cell { width: 6px; height: 6px; background: #2c3e50; border-radius: 1px; }
        .mini-cell.on { background: #f1c40f; }
        .piece-name { font-size: 9px; color: #bdc3c7; white-space: nowrap; transform: scale(0.85); }

        /* 🚀 配置適用アクションボタン（スマホ専用デザイン） */
        .apply-action-container { width: 100%; margin-top: 5px; }
        .apply-btn { width: 100%; background: #27ae60; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4); transition: all 0.1s ease; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .apply-btn:active { transform: translateY(2px); box-shadow: 0 2px 5px rgba(39, 174, 96, 0.4); }
        .apply-btn:disabled { background: #7f8c8d; color: #bdc3c7; opacity: 0.4; cursor: not-allowed; box-shadow: none; }

        /* ログエリア */
        .log-container { display: flex; flex-direction: column; background: #0b0e11; border-radius: 6px; border: 1px solid #34495e; height: 110px; width: 100%; }
        .log-status { background: #1a252f; padding: 5px 8px; font-weight: bold; font-size: 11px; color: #f1c40f; border-bottom: 1px solid #34495e; }
        .log { padding: 8px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 10px; color: #ecf0f1; flex-grow: 1; white-space: pre-wrap; line-height: 1.3; scroll-behavior: smooth; }
        .log-entry { margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px dashed #2c3e50; }
        .log-time { color: #95a5a6; font-size: 9px; margin-right: 4px; }
        .log-type-ai { color: #2ecc71; }
        .log-type-sys { color: #3498db; }
        .log-type-err { color: #e74c3c; }

        /* ボタン調整（スマホ用にタップ領域確保） */
        .clear-btn { background: #c0392b; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .btn-group { display: flex; gap: 4px; }
        .log-btn { background: #34495e; color: white; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: bold; }
        .log-btn.copy-btn { background: #2980b9; }
        .log-btn.clear-log-btn { background: #7f8c8d; }
    </style>
</head>
<body>

    <h1>🚀 Block Blast AI - MOBILE V3.1</h1>
    <div class="subtitle">スマホ完全最適化 / 「配置を適用」タップボタン ＆ ログ簡単コピー搭載</div>

    <div class="container">
        <div class="board-wrapper">
            <div class="bank-title" style="width: 100%;">
                <span>💻 盤面（タップ・ドラッグ描画）</span>
                <button class="clear-btn" onclick="clearAllBoard()">🛑 全消去</button>
            </div>
            <div id="board-grid" class="grid"></div>
            
            <div style="width: 100%; margin-top: 5px;">
                <div class="bank-title">📊 リアルタイム盤面解析</div>
                <div class="status-dashboard">
                    <div class="status-card large">
                        <div>
                            <span class="eval-title">🛡️ 評価: </span>
                            <span id="stat-eval-text" style="font-weight: bold;">安全</span>
                        </div>
                        <div id="stat-eval-score" class="eval-score">100点</div>
                    </div>
                    
                    <div class="status-card">
                        <div class="status-label">埋まり/空き</div>
                        <div id="stat-filled-pct" class="status-value">0マス</div>
                    </div>
                    <div class="status-card">
                        <div class="status-label">3x3スペース</div>
                        <div id="stat-3x3" class="status-value">36箇所</div>
                    </div>
                    <div class="status-card">
                        <div class="status-label">孤立穴/溝</div>
                        <div id="stat-holes" class="status-value">0 / 0</div>
                    </div>
                    <div class="status-card">
                        <div class="status-label">消去準備列</div>
                        <div id="stat-setup" class="status-value">0列</div>
                    </div>
                    <div class="status-card">
                        <div class="status-label">表面凹凸度</div>
                        <div id="stat-bumpiness" class="status-value">0</div>
                    </div>
                    <div class="status-card">
                        <div class="status-label">危険度Lv</div>
                        <div id="stat-danger" class="status-value">Lv.0</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="bank-title">📥 1. 手持ちスロット (タップして選択)</div>
            <div id="slots-container" class="slots"></div>

            <div class="bank-title">🧱 2. ブロック図鑑 (全51種)</div>
            <div id="pieces-bank" class="pieces-bank"></div>

            <div class="apply-action-container">
                <button id="apply-route-btn" class="apply-btn" onclick="applyBestSequence()" disabled>
                    🚀 最適な配置を盤面に適用する
                </button>
            </div>

            <div class="bank-title">
                <span>📜 3. AI 最適解 ＆ 履歴</span>
                <div class="btn-group">
                    <button class="log-btn copy-btn" onclick="copyLogs(this)">📋 コピー</button>
                    <button class="log-btn clear-log-btn" onclick="clearLogs()">🗑️ 消去</button>
                </div>
            </div>
            
            <div class="log-container">
                <div id="live-status" class="log-status">💡 待機中：ブロックを3つ選んでください。</div>
                <div id="log-history" class="log"></div>
            </div>
        </div>
    </div>

<script>
let boardGrid = Array.from({ length: 8 }, () => Array(8).fill(0));
let selectedPieces = [null, null, null];
let activeSlot = 0;
let bestSequence = null;
let isDrawing = false;
let drawMode = 1;
let textLogHistory = [];

const PIECE_PRESETS = [
    { key: "1", name: "1x1マス", matrix: [[1]] },
    { key: "2", name: "横2連", matrix: [[1, 1]] },
    { key: "3", name: "横3連", matrix: [[1, 1, 1]] },
    { key: "4", name: "横4連", matrix: [[1, 1, 1, 1]] },
    { key: "5", name: "横5連", matrix: [[1, 1, 1, 1, 1]] },
    { key: "q", name: "縦2連", matrix: [[1], [1]] },
    { key: "w", name: "縦3連", matrix: [[1], [1], [1]] },
    { key: "e", name: "縦4連", matrix: [[1], [1], [1], [1]] },
    { key: "r", name: "縦5連", matrix: [[1], [1], [1], [1], [1]] },
    { key: "a", name: "正方形 2x2", matrix: [[1, 1], [1, 1]] },
    { key: "s", name: "正方形 3x3", matrix: [[1, 1, 1], [1, 1, 1], [1, 1, 1]] },
    { key: "6", name: "長方形 2x3縦", matrix: [[1, 1], [1, 1], [1, 1]] },
    { key: "7", name: "長方形 2x3横", matrix: [[1, 1, 1], [1, 1, 1]] },
    { key: "d", name: "小L-0°", matrix: [[1, 0], [1, 1]] },
    { key: "f", name: "小L-90°", matrix: [[1, 1], [1, 0]] },
    { key: "g", name: "小L-180°", matrix: [[1, 1], [0, 1]] },
    { key: "h", name: "小L-270°", matrix: [[0, 1], [1, 1]] },
    { key: "j", name: "大L-0°", matrix: [[1, 0], [1, 0], [1, 1]] },
    { key: "k", name: "大L-90°", matrix: [[1, 1, 1], [1, 0, 0]] },
    { key: "l", name: "大L-180°", matrix: [[1, 1], [0, 1], [0, 1]] },
    { key: "p", name: "大L-270°", matrix: [[0, 0, 1], [1, 1, 1]] },
    { key: "z", name: "T字 ⬇️", matrix: [[1, 1, 1], [0, 1, 0]] },
    { key: "x", name: "T字 ⬆️", matrix: [[0, 1, 0], [1, 1, 1]] },
    { key: "c", name: "T字 ➡️", matrix: [[1, 0], [1, 1], [1, 0]] },
    { key: "v", name: "T字 ⬅️", matrix: [[0, 1], [1, 1], [0, 1]] },
    { key: "b", name: "Z階段 横", matrix: [[1, 1, 0], [0, 1, 1]] },
    { key: "n", name: "S階段 横", matrix: [[0, 1, 1], [1, 1, 0]] },
    { key: "m", name: "Z階段 縦", matrix: [[0, 1], [1, 1], [1, 0]] }
];

window.onload = function() {
    buildBoardGrid();
    buildSlots();
    buildPieceCards();
    setupEvents();
    updateLiveDashboard();
    addLog("モバイルシステム（V3.1 ボタン対応版）起動完了。", "sys");
};

function addLog(message, type = 'ai') {
    const historyBox = document.getElementById('log-history');
    const now = new Date();
    const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
    
    const entry = document.createElement('div');
    entry.className = `log-entry log-type-${type}`;
    entry.innerHTML = `<span class="log-time">[${timeStr}]</span> ${message.replace(/\n/g, '<br>')}`;
    historyBox.appendChild(entry);
    
    textLogHistory.push(`[${timeStr}] ${message}`);
    historyBox.scrollTop = historyBox.scrollHeight;
}

function updateLiveStatus(message, color = '#f1c40f') {
    const statusBox = document.getElementById('live-status');
    statusBox.innerText = message;
    statusBox.style.color = color;
}

function clearLogs() {
    document.getElementById('log-history').innerHTML = '';
    textLogHistory = [];
    addLog("ログをクリアしました。", "sys");
}

function copyLogs(btn) {
    if (textLogHistory.length === 0) return;
    navigator.clipboard.writeText(textLogHistory.join("\n\n")).then(() => {
        const txt = btn.innerText; btn.innerText = "✅ OK"; btn.style.background = "#2ecc71";
        setTimeout(() => { btn.innerText = txt; btn.style.background = ""; }, 1200);
    });
}

function buildBoardGrid() {
    const grid = document.getElementById('board-grid'); grid.innerHTML = '';
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            const cell = document.createElement('div');
            cell.className = 'bc'; cell.id = `bc-${r}-${c}`;
            
            cell.addEventListener('mousedown', (e) => { e.preventDefault(); isDrawing = true; drawMode = boardGrid[r][c] === 1 ? 0 : 1; toggleCell(r, c); });
            cell.addEventListener('mouseenter', () => { if (isDrawing) toggleCell(r, c); });
            cell.addEventListener('touchstart', (e) => { isDrawing = true; drawMode = boardGrid[r][c] === 1 ? 0 : 1; toggleCell(r, c); });
            
            grid.appendChild(cell);
        }
    }
    window.addEventListener('mouseup', () => isDrawing = false);
    window.addEventListener('touchend', () => isDrawing = false);
}

function toggleCell(r, c) { 
    boardGrid[r][c] = drawMode; 
    clearHints();
    renderBoard(); 
    runAI(); 
}

function renderBoard() {
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            const cell = document.getElementById(`bc-${r}-${c}`);
            if (boardGrid[r][c] === 1) cell.className = 'bc filled';
            else cell.className = 'bc';
        }
    }
    updateLiveDashboard();
}

function updateLiveDashboard() {
    let filledCount = 0; let fatalHoles = 0; let deadEnds = 0; let spaceFor3x3 = 0; let setupRowsCols = 0;
    let rowCounts = Array(8).fill(0); let colCounts = Array(8).fill(0); let columnHeights = Array(8).fill(0);
    
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            if (boardGrid[r][c] === 1) {
                filledCount++; rowCounts[r]++; colCounts[c]++;
                if (columnHeights[c] === 0) columnHeights[c] = 8 - r;
            } else {
                let up = (r === 0 || boardGrid[r-1][c] === 1) ? 1 : 0;
                let down = (r === 7 || boardGrid[r+1][c] === 1) ? 1 : 0;
                let left = (c === 0 || boardGrid[r][c-1] === 1) ? 1 : 0;
                let right = (c === 7 || boardGrid[r][c+1] === 1) ? 1 : 0;
                if (up+down+left+right === 4) fatalHoles++;
                else if (up+down+left+right === 3) deadEnds++;
            }
            if (r <= 5 && c <= 5) {
                let canFit = true;
                for (let i = 0; i < 3; i++) {
                    for (let j = 0; j < 3; j++) { if (boardGrid[r+i][c+j] === 1) { canFit = false; break; } }
                }
                if (canFit) spaceFor3x3++;
            }
        }
    }
    for (let i = 0; i < 8; i++) {
        if (rowCounts[i] === 5 || rowCounts[i] === 6) setupRowsCols++;
        if (colCounts[i] === 5 || colCounts[i] === 6) setupRowsCols++;
    }
    let bumpiness = 0;
    for (let c = 0; c < 7; c++) bumpiness += Math.abs(columnHeights[c] - columnHeights[c+1]);

    let score = 100 - (fatalHoles * 25) - (deadEnds * 8) - (bumpiness * 1.5) + (setupRowsCols * 3);
    if (spaceFor3x3 === 0) score -= 40;
    score = Math.max(0, Math.min(100, Math.round(score)));

    let clr = "#2ecc71"; let txt = "👑 健全"; let dng = "安全";
    if (score < 40) { clr = "#e74c3c"; txt = "🚨 崩壊"; dng = "致命的"; }
    else if (score < 65) { clr = "#e67e22"; txt = "🟡 警告"; dng = "警戒"; }

    document.getElementById('stat-eval-score').innerText = `${score}点`;
    document.getElementById('stat-eval-text').innerText = txt;
    document.getElementById('stat-eval-text').style.color = clr;
    document.getElementById('stat-eval-score').style.color = clr;
    document.getElementById('stat-filled-pct').innerText = `${filledCount}マス`;
    document.getElementById('stat-3x3').innerText = `${spaceFor3x3}箇所`;
    document.getElementById('stat-holes').innerText = `${fatalHoles} / ${deadEnds}`;
    document.getElementById('stat-setup').innerText = `${setupRowsCols}列`;
    document.getElementById('stat-bumpiness').innerText = bumpiness;
    document.getElementById('stat-danger').innerText = dng;

    // 最適解の有無に合わせて配置ボタンのアクティブ状態を制御
    const applyBtn = document.getElementById('apply-route-btn');
    if (bestSequence) {
        applyBtn.removeAttribute('disabled');
        applyBtn.style.background = "#27ae60";
    } else {
        applyBtn.setAttribute('disabled', 'true');
        applyBtn.style.background = "#7f8c8d";
    }
}

function clearHints() {
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            const cell = document.getElementById(`bc-${r}-${c}`);
            cell.classList.remove('hint-1', 'hint-2', 'hint-3'); cell.innerText = "";
        }
    }
}

function clearAllBoard() {
    boardGrid = Array.from({ length: 8 }, () => Array(8).fill(0));
    bestSequence = null; clearHints(); renderBoard(); runAI();
    addLog("🛑 盤面をリセットしました。", "sys");
}

function buildSlots() {
    const container = document.getElementById('slots-container'); container.innerHTML = '';
    for (let i = 0; i < 3; i++) {
        const slot = document.createElement('div');
        slot.className = `slot ${i === activeSlot ? 'active' : ''}`;
        slot.innerText = selectedPieces[i] ? `${selectedPieces[i].name}` : `[Slot ${i+1}]`;
        slot.addEventListener('click', () => { activeSlot = i; updateSlotHighlight(); });
        container.appendChild(slot);
    }
}

function updateSlotHighlight() {
    for (let i = 0; i < 3; i++) {
        const slot = document.getElementById(`slots-container`).children[i];
        if (slot) i === activeSlot ? slot.classList.add('active') : slot.classList.remove('active');
    }
}

function buildPieceCards() {
    const container = document.getElementById('pieces-bank'); container.innerHTML = '';
    PIECE_PRESETS.forEach(piece => {
        const card = document.createElement('div'); card.className = 'piece-card';
        card.innerHTML = `<div class="piece-name">${piece.name}</div>`;
        const visual = document.createElement('div'); visual.className = 'mini-matrix';
        piece.matrix.forEach(row => {
            const rDiv = document.createElement('div'); rDiv.className = 'mini-row';
            row.forEach(cell => {
                const cDiv = document.createElement('div'); cDiv.className = `mini-cell ${cell === 1 ? 'on' : ''}`;
                rDiv.appendChild(cDiv);
            });
            visual.appendChild(rDiv);
        });
        card.appendChild(visual);
        card.addEventListener('click', () => selectPiece(piece));
        container.appendChild(card);
    });
}

function selectPiece(piece) {
    selectedPieces[activeSlot] = piece; buildSlots();
    let nextSlot = selectedPieces.findIndex(p => p === null);
    if (nextSlot !== -1) activeSlot = nextSlot;
    updateSlotHighlight(); runAI();
}

// 🚀 配置適用ロジック（スペースキーおよび適用ボタン兼用）
function applyBestSequence() {
    if (!bestSequence) return;
    
    let totalLinesCleared = 0;
    bestSequence.forEach((step) => {
        const matrix = step.matrix;
        for (let i = 0; i < matrix.length; i++) {
            for (let j = 0; j < matrix[0].length; j++) {
                if (matrix[i][j] === 1) boardGrid[step.r + i][step.c + j] = 1;
            }
        }
        totalLinesCleared += clearLinesAndCount(boardGrid);
    });
    
    addLog(`✅ 配置を適用しました (消去ライン計: ${totalLinesCleared})`, "sys");
    
    selectedPieces = [null, null, null];
    activeSlot = 0;
    bestSequence = null;
    buildSlots();
    clearHints();
    renderBoard();
    updateLiveStatus("💡 次の3つのブロックを選んでください。");
}

function setupEvents() {
    window.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.code === 'Space') {
            e.preventDefault();
            if (bestSequence) applyBestSequence();
            return;
        }
        if (e.key === 'Escape') {
            selectedPieces = [null, null, null]; activeSlot = 0; bestSequence = null;
            buildSlots(); clearHints(); renderBoard();
            updateLiveStatus("💡 ブロックを選んでください。");
        }
    });
}

function runAI() {
    clearHints();
    if (selectedPieces.some(p => p === null)) {
        bestSequence = null;
        updateLiveStatus(`💡 あと ${selectedPieces.filter(p=>p===null).length} つ選択してください。`);
        return;
    }
    
    let bestScore = -9999999; bestSequence = null;
    const orders = [[0,1,2], [0,2,1], [1,0,2], [1,2,0], [2,0,1], [2,1,0]];
    orders.forEach(order => simulateStep(boardGrid, order, 0, [], 1));

    function simulateStep(currentGrid, order, stepIndex, currentSeq, currentCombo) {
        if (stepIndex === 3) {
            let finalScore = evaluateBoard(currentGrid, currentCombo);
            if (finalScore > bestScore) { bestScore = finalScore; bestSequence = JSON.parse(JSON.stringify(currentSeq)); }
            return;
        }
        const piece = selectedPieces[order[stepIndex]]; if (!piece) return;
        const matrix = piece.matrix;
        
        for (let r = 0; r <= 8 - matrix.length; r++) {
            for (let c = 0; c <= 8 - matrix[0].length; c++) {
                if (canPlace(currentGrid, matrix, r, c)) {
                    let nextGrid = currentGrid.map(row => [...row]);
                    for (let i = 0; i < matrix.length; i++) {
                        for (let j = 0; j < matrix[0].length; j++) { if (matrix[i][j] === 1) nextGrid[r+i][c+j] = 1; }
                    }
                    let cleared = clearLinesAndCount(nextGrid);
                    simulateStep(nextGrid, order, stepIndex + 1, [...currentSeq, { slotId: order[stepIndex], r, c, matrix }], cleared > 0 ? currentCombo + 1 : 1);
                }
            }
        }
    }

    renderBoard();
    if (bestSequence) {
        updateLiveStatus("✨ 最適解ルートを算出しました！ボタンかスペースで適用可能", "#2ecc71");
        let msg = `【AI提案】\n`;
        const cls = ['hint-1', 'hint-2', 'hint-3'];
        bestSequence.forEach((step, idx) => {
            msg += `${idx+1}手目: [${selectedPieces[step.slotId].name}] ➔ ${step.r + 1}行 ${step.c + 1}列\n`;
            for (let i = 0; i < step.matrix.length; i++) {
                for (let j = 0; j < step.matrix[0].length; j++) {
                    if (step.matrix[i][j] === 1) {
                        const cell = document.getElementById(`bc-${step.r + i}-${step.c + j}`);
                        if (cell) { cell.className = `bc ${cls[idx]}`; cell.innerText = idx + 1; }
                    }
                }
            }
        });
        addLog(msg, "ai");
    } else {
        updateLiveStatus("❌ 配置ルートがありません。詰み状態です。", "#e74c3c");
        addLog("🚨 配置不可ルート（ゲームオーバー判定）", "err");
    }
}

function canPlace(grid, matrix, startR, startC) {
    for (let i = 0; i < matrix.length; i++) {
        for (let j = 0; j < matrix[0].length; j++) {
            if (matrix[i][j] === 1 && grid[startR + i][startC + j] === 1) return false;
        }
    }
    return true;
}

function clearLinesAndCount(grid) {
    let rows = []; let cols = [];
    for (let r = 0; r < 8; r++) if (grid[r].every(v => v === 1)) rows.push(r);
    for (let c = 0; c < 8; c++) if (grid.every(row => row[c] === 1)) cols.push(c);
    rows.forEach(r => grid[r].fill(0));
    cols.forEach(c => { for (let r = 0; r < 8; r++) grid[r][c] = 0; });
    return rows.length + cols.length;
}

function evaluateBoard(grid, currentCombo) {
    let filled = 0; let holes = 0; let deads = 0; let setup = 0;
    let rowCounts = Array(8).fill(0); let colCounts = Array(8).fill(0);
    
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            if (grid[r][c] === 1) { filled++; rowCounts[r]++; colCounts[c]++; }
            else {
                let u = (r === 0 || grid[r-1][c] === 1) ? 1 : 0;
                let d = (r === 7 || grid[r+1][c] === 1) ? 1 : 0;
                let l = (c === 0 || grid[r][c-1] === 1) ? 1 : 0;
                let g = (c === 7 || grid[r][c+1] === 1) ? 1 : 0;
                if (u+d+l+g === 4) holes++; else if (u+d+l+g === 3) deads++;
            }
        }
    }
    for (let i = 0; i < 8; i++) {
        if (rowCounts[i] === 5 || rowCounts[i] === 6) setup += 60;
        if (colCounts[i] === 5 || colCounts[i] === 6) setup += 60;
    }
    let spaceFor3x3 = 0;
    for (let r = 0; r <= 5; r++) {
        for (let c = 0; c <= 5; c++) {
            let fit = true;
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) { if (grid[r+i][c+j] === 1) fit = false; }
            }
            if (fit) spaceFor3x3++;
        }
    }
    return (currentCombo * 1000) + setup - (holes * 500) - (deads * 150) + (spaceFor3x3 > 0 ? 300 : -2000) - (filled > 51 ? (filled - 51) * 100 : 0);
}
</script>
